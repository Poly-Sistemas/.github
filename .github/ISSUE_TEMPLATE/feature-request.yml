name: "🚀 Propuesta de Feature"
description: "Sugiere una nueva funcionalidad o mejora para el proyecto."
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: user-story
    attributes:
      label: "¿Cuál es la necesidad o problema?"
      description: |
        Explica el contexto de negocio o técnico. (Ej: "Como usuario, necesito... para poder...")
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Solución propuesta"
      description: "Describe de forma clara cómo te imaginas el comportamiento de esta nueva característica."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Prioridad sugerida"
      options:
        - "Must Have (Crítico)"
        - "Should Have (Alta importancia)"
        - "Could Have (Deseable / 'Nice to have')"
